name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Pull requests: build + smoke test both arches, never publish.
  # main: build + smoke test, then publish :edge and :sha-<commit> — the same tested digest.
  image:
    needs: checks
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      version: edge-${{ github.sha }}
      tags: |
        type=edge,branch=main
        type=sha,prefix=sha-
