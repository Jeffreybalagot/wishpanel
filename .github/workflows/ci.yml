name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with "ruff>=0.6" ruff check .
      - run: uv run --no-project --with "ruff>=0.6" ruff format --check .
      - name: shellcheck entrypoint
        run: shellcheck docker/entrypoint.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -q

  # Main-branch builds publish ghcr.io/<owner>/wishpanel:edge (+ sha tag).
  # Pull requests build the image (both arches) without pushing, to catch breakage.
  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boot the freshly built amd64 image with an empty /config and wait for HEALTHCHECK.
  smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: wishpanel:smoke
          cache-from: type=gha
      - name: Boot with empty /config and wait for healthy
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          docker run -d --name wp -p 5658:8080 -e PUID=1001 -e PGID=1001 \
            -v "$RUNNER_TEMP/config:/config" wishpanel:smoke
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' wp)
            echo "health: $state"; [ "$state" = "healthy" ] && break; sleep 3
          done
          docker logs wp
          [ "$(docker inspect -f '{{.State.Health.Status}}' wp)" = "healthy" ]
          curl -fsS localhost:5658/health
          curl -fsS localhost:5658/ | grep -q WishPanel
          test "$(stat -c %u:%g "$RUNNER_TEMP/config/secret.key")" = "1001:1001"
          # PID 1 must be the app, running as the requested PUID (not root)
          docker exec wp grep -E '^Uid:\s+1001\b' /proc/1/status
