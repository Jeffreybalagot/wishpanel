name: Release

# Push a tag like v2.0.0 (or v2.0.0-alpha.1 for a pre-release).
# Same gate as main: checks -> build -> smoke test -> publish the tested digest.
# Stable tags also move :latest; pre-release tags never do.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
      version: ${{ github.ref_name }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Image: `ghcr.io/jeffreybalagot/wishpanel@${{ needs.image.outputs.digest }}`
            (this exact digest passed the container smoke tests before publication)
