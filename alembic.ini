# Developer convenience only — the app runs migrations itself on every boot.
#   CONFIG_DIR=./.devconfig alembic revision --autogenerate -m "add requests table"
[alembic]
script_location = app/db/migrations
sqlalchemy.url = sqlite:///./.devconfig/wishpanel.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
