[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wishpanel"
dynamic = ["version"]
description = "Ombi-style request portal for comics, manga and manhwa (Kavita + Kapowarr + Suwayomi)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Jeffrey Balagot" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27,<1.0",
    "cryptography>=43",
    "pydantic>=2.7,<3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
wishpanel = "app.__main__:main"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = [
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # we intentionally use the bullet character for masked secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "E501"]
"app/db/migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
